version: '3.8'

services:
  # 1. PostgreSQL 16 数据库容器
  postgres:
    image: postgres:16-alpine
    container_name: starry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starry_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-starry_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-starry_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js API 后端服务容器
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: starry_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-starry_secret_password}@postgres:5432/${POSTGRES_DB:-starry_db}?schema=public
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET:-starry_client_secret_prod}
      JWT_CLIENT_EXPIRES_IN: ${JWT_CLIENT_EXPIRES_IN:-7d}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-starry_admin_secret_prod}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-1d}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-wx_dummy_appid}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:-dummy_secret}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. 管理后台前端与 Nginx 网关容器
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: starry_admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro

volumes:
  postgres_data:
    name: starry_postgres_data
  uploads_data:
    name: starry_uploads_data
