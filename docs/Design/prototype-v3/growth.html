<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>若星 · 我的成长</title>
<link rel="stylesheet" href="assets/ruoxing.css">
<style>
  .starmap {
    position: relative;
    height: 340px;
    margin: 6px 20px 0;
    border-radius: 12px;
    background: radial-gradient(ellipse at 50% 30%, #26345A 0%, var(--night) 75%);
    overflow: hidden;
  }
  .starmap svg { width: 100%; height: 100%; display: block; }
  .star-anim-1 { animation: starOn 1s ease-out both; animation-delay: .3s; transform-origin: center; transform-box: fill-box; }
  .star-anim-2 { animation: starOn 1s ease-out both; animation-delay: .8s; transform-origin: center; transform-box: fill-box; }
  .star-anim-3 { animation: starOn 1s ease-out both; animation-delay: 1.3s; transform-origin: center; transform-box: fill-box; }
  .map-caption { font-size: 10px; fill: rgba(233,228,216,.5); font-family: var(--sans); letter-spacing: .05em; }
  .growth-line { text-align: center; margin-top: 26px; }
</style>
</head>
<body>
<div class="screen night no-tabbar">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>

    </span>
  </div>

  <div class="navbar">
    <a class="back" aria-label="返回" href="me.html"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 36L19 24L31 12"/></svg></a>
    <span class="nav-title">我的成长</span>
    <div class="capsule" aria-hidden="true"><span class="cap-half"><span class="cap-dots"><i></i><i></i><i></i></span></span><span class="cap-divider"></span><span class="cap-half"><span class="cap-target"></span></span></div>
  </div>

      <g fill="#F0D9A8">
        <circle cx="30" cy="40" r="1" opacity=".25"/>
        <circle cx="70" cy="24" r="1.4" opacity=".2"/>
        <circle cx="120" cy="52" r="1" opacity=".3"/>
        <circle cx="180" cy="28" r="1.2" opacity=".18"/>
        <circle cx="240" cy="46" r="1" opacity=".28"/>

        <circle cx="320" cy="90" r="1" opacity=".25"/>
        <circle cx="20" cy="120" r="1.2" opacity=".2"/>
        <circle cx="55" cy="180" r="1" opacity=".22"/>
        <circle cx="310" cy="160" r="1.3" opacity=".18"/>
        <circle cx="290" cy="230" r="1" opacity=".25"/>
        <circle cx="40" cy="260" r="1.4" opacity=".2"/>
        <circle cx="110" cy="310" r="1" opacity=".24"/>
        <circle cx="200" cy="320" r="1.2" opacity=".18"/>
        <circle cx="265" cy="300" r="1" opacity=".26"/>
        <circle cx="150" cy="90" r="1" opacity=".15"/>
        <circle cx="85" cy="300" r="1" opacity=".2"/>
        <circle cx="250" cy="120" r="1.1" opacity=".16"/>
      </g>

      <!-- 星座连线 -->
      <g stroke="#F0D9A8" stroke-width=".8" opacity=".3">
        <line x1="58" y1="96" x2="96" y2="140"/>
        <line x1="96" y1="140" x2="142" y2="110"/>
        <line x1="142" y1="110" x2="172" y2="168"/>
        <line x1="172" y1="168" x2="132" y2="212"/>
        <line x1="132" y1="212" x2="178" y2="248"/>
        <line x1="178" y1="248" x2="238" y2="216"/>
        <line x1="238" y1="216" x2="262" y2="150"/>
        <line x1="262" y1="150" x2="172" y2="168"/>
        <line x1="238" y1="216" x2="276" y2="262"/>

      <!-- 已点亮的星 -->
      <g>
        <circle cx="58" cy="96" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="58" cy="96" r="3.5" fill="#F0D9A8"/>

      <g class="star-anim-1">
        <circle cx="96" cy="140" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="96" cy="140" r="3.5" fill="#F0D9A8"/>
      </g>
      <g>
        <circle cx="142" cy="110" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="142" cy="110" r="3.5" fill="#F0D9A8"/>
      </g>
      <g class="star-anim-2">
        <circle cx="172" cy="168" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="172" cy="168" r="3.5" fill="#F0D9A8"/>
      </g>
      <g>
        <circle cx="132" cy="212" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="132" cy="212" r="3.5" fill="#F0D9A8"/>
      </g>
      <g class="star-anim-3">
        <circle cx="178" cy="248" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="178" cy="248" r="3.5" fill="#F0D9A8"/>
      </g>
      <g>
        <circle cx="238" cy="216" r="7" fill="#F0D9A8" opacity=".15"/>
        <circle cx="238" cy="216" r="3.5" fill="#F0D9A8"/>
      </g>

      <!-- 未点亮的星 -->
      <circle cx="262" cy="150" r="2.5" fill="none" stroke="rgba(233,228,216,.3)"/>
      <circle cx="276" cy="262" r="2.5" fill="none" stroke="rgba(233,228,216,.3)"/>

      <!-- 标注 -->
      <text x="44" y="84" class="map-caption">料理课</text>
      <text x="120" y="198" class="map-caption">第一次打卡</text>
      <text x="226" y="240" class="map-caption">成为会员</text>
    </svg>
  </div>

  <p class="page-title growth-line">两年里，你点亮了 12 颗星。</p>

  <div class="star-divider" style="margin: 32px 0;">✦&nbsp;&nbsp;✦&nbsp;&nbsp;✦</div>

  <!-- 走过的路 -->
  <div class="section" style="margin-bottom: 24px;">
    <div class="section-head">
      <span class="section-title">走过的路</span>
    </div>
    <div class="timeline">
      <div class="timeline-item">
        <div class="tl-title" style="font-size:15px;">2024 年秋 · 第一次走进料理课</div>
      </div>
      <div class="timeline-item">
        <div class="tl-title" style="font-size:15px;">2025 年春 · 完成空间管理课，家里的柜子变了样</div>
      </div>
      <div class="timeline-item">
        <div class="tl-title" style="font-size:15px;">2025 年夏 · 成为基础会员</div>
      </div>
      <div class="timeline-item pending" style="padding-bottom: 0;">
        <div class="tl-title" style="font-size:15px;">2026 年 · 持续实践中</div>
      </div>
    </div>
  </div>

  <p class="micro" style="text-align:center; padding-bottom: 40px;">星星不着急，慢慢亮。</p>

</div>
</body>
</html>
