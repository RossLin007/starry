<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>若星 · 记录本次实践</title>
<link rel="stylesheet" href="assets/ruoxing.css">
<style>
  .upload-box {
    border: 1px dashed var(--rice);
    border-radius: 12px;
    height: 120px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    background: transparent;
  }
  .upload-box .u-star { font-size: 24px; color: var(--rice); line-height: 1; }
  .upload-box .u-text { font-size: 13px; color: var(--ash); }
  .action-bar .micro {
    display: block; text-align: center; margin-top: 12px;
  }
</style>
</head>
<body>
<div class="screen no-tabbar">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor" stroke="none"/><path d="M23.5 3.5v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <div class="navbar">
    <a class="back" aria-label="返回" href="lesson.html"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 36L19 24L31 12"/></svg></a>
    <span class="nav-title">记录本次实践</span>
    <div class="capsule" aria-hidden="true"><span class="cap-half"><span class="cap-dots"><i></i><i></i><i></i></span></span><span class="cap-divider"></span><span class="cap-half"><span class="cap-target"></span></span></div>
  </div>

  <div class="section fade-up" style="margin-bottom: 8px;">
    <p style="font-family: var(--serif); font-size: 15px; line-height: 1.8;">
      不必完美。真实的一次，就很好。
    </p>
  </div>

  <div class="section" style="padding-top: 0;">
    <div class="field" style="padding-top: 0;">
      <textarea rows="5" placeholder="这次实践中，你注意到了什么？写下来…" id="checkinText"></textarea>
    </div>
    <div class="upload-box" id="uploadBox" style="margin-top: 10px;">
      <span class="u-star">✦</span>
      <span class="u-text">添加照片 · 最多 9 张</span>
    </div>
    <div class="upload-type" style="display: flex; gap: 10px; margin-top: 12px;">
      <span class="tag-chip active" data-type="photo" style="padding: 6px 12px; font-size: 12px; cursor: pointer;">图片</span>
      <span class="tag-chip" data-type="text" style="padding: 6px 12px; font-size: 12px; cursor: pointer;">文字</span>
      <span class="tag-chip" data-type="video" style="padding: 6px 12px; font-size: 12px; cursor: pointer;">视频</span>
    </div>
  </div>

  <div class="section">
    <div class="field">
      <label>关联课程 / 课节</label>
      <select id="courseSelect">
        <option value="reading">拾光读书 · 第 1 课 · 走进瓦尔登</option>
        <option value="space">空间管理 · 第 1 课 · 看见你的空间</option>
        <option value="cooking">生活料理 · 第 1 课 · 认识你的厨房</option>
      </select>
    </div>
    <div class="field">
      <label>选择标签 <span style="color: var(--crimson);">*</span></label>
      <div class="tag-select" id="tagSelect">
        <!-- 按课程动态渲染 -->
      </div>
      <div class="meta" style="margin-top: 8px; font-size: 12px;" id="tagHint">请至少选择一个标签，方便日后分类与统计</div>
    </div>
  </div>

  <div class="action-bar">
    <a class="btn-primary" id="submitCheckin" href="#">留下这次实践</a>
    <span class="micro">提交后，老师会认真读。也可以分享这一次实践，给朋友一点光。</span>
  </div>

</div>

<!-- 分享面板 -->

        <span class="sg-label">发送给好友</span>
      </button>
      <button type="button" data-share="群聊">
        <span class="sg-ico" style="background: var(--bamboo);"><svg width="24" height="24" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20C22.866 20 26 16.866 26 13C26 9.13401 22.866 6 19 6C15.134 6 12 9.13401 12 13C12 16.866 15.134 20 19 20Z"/><path d="M32.6077 7C34.6405 8.2249 36.0001 10.4537 36.0001 13C36.0001 15.5463 34.6405 17.7751 32.6077 19"/><path d="M4 40.8V42H34V40.8C34 36.3196 34 34.0794 33.1281 32.3681C32.3611 30.8628 31.1372 29.6389 29.6319 28.8719C27.9206 28 25.6804 28 21.2 28H16.8C12.3196 28 10.0794 28 8.36808 28.8719C6.86278 29.6389 5.63893 30.8628 4.87195 32.3681C4 34.0794 4 36.3196 4 40.8Z"/><path d="M43.9999 42.0001V40.8001C43.9999 36.3197 43.9999 34.0795 43.128 32.3682C42.361 30.8629 41.1371 29.6391 39.6318 28.8721"/></svg></span>
        <span class="sg-label">分享到群聊</span>
      </button>
      <button type="button" data-share="海报">
        <span class="sg-ico" style="background: var(--ink);"><svg width="24" height="24" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M39 6H9C7.34315 6 6 7.34315 6 9V39C6 40.6569 7.34315 42 9 42H39C40.6569 42 42 40.6569 42 39V9C42 7.34315 40.6569 6 39 6Z"/><path d="M18 23C20.7614 23 23 20.7614 23 18C23 15.2386 20.7614 13 18 13C15.2386 13 13 15.2386 13 18C13 20.7614 15.2386 23 18 23Z"/><path d="M27.7901 26.2194C28.6064 25.1269 30.2528 25.1538 31.0329 26.2725L39.8077 38.8561C40.7322 40.182 39.7835 42.0001 38.1671 42.0001H16L27.7901 26.2194Z"/></svg></span>
        <span class="sg-label">生成分享图</span>
      </button>
    </div>
    <button type="button" class="share-cancel" id="shareCancel">取消</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var mask = document.getElementById('shareMask');
  var toast = document.getElementById('toast');
  var submit = document.getElementById('submitCheckin');
  var cancel = document.getElementById('shareCancel');

  function open() { mask.classList.add('open'); }
  function close() { mask.classList.remove('open'); }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  /* ---- 上传类型切换 ---- */
  var uploadBox = document.getElementById('uploadBox');
  var typeChips = document.querySelectorAll('.upload-type .tag-chip');
  var typeTexts = { photo: '添加照片 · 最多 9 张', text: '纯文字记录（无需配图）', video: '添加视频 · 最长 3 分钟' };
  typeChips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      typeChips.forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      var t = chip.getAttribute('data-type');
      uploadBox.querySelector('.u-text').textContent = typeTexts[t];
      uploadBox.style.opacity = (t === 'text') ? '.45' : '1';
    });
  });

  /* ---- 标签（按课程） ---- */
  var tagSets = {
    reading: ['独处', '自然', '简朴', '阅读', '沉思'],
    space: ['盘点', '断舍离', '整理', '清洁'],
    cooking: ['冰箱管理', '动线设计', '食材预处理']
  };
  var courseSelect = document.getElementById('courseSelect');
  var tagSelect = document.getElementById('tagSelect');
  var tagHint = document.getElementById('tagHint');
  var selectedTags = [];
  function renderTags() {
    var key = courseSelect.value;
    var tags = tagSets[key] || [];
    selectedTags = [];
    tagSelect.innerHTML = '';
    tags.forEach(function (name) {
      var el = document.createElement('span');
      el.className = 'tag-chip';
      el.textContent = name;
      el.addEventListener('click', function () {
        el.classList.toggle('active');
        var i = selectedTags.indexOf(name);
        if (i >= 0) selectedTags.splice(i, 1); else selectedTags.push(name);
        tagHint.textContent = selectedTags.length ? ('已选 ' + selectedTags.length + ' 个：' + selectedTags.join('、')) : '请至少选择一个标签，方便日后分类与统计';
        tagHint.style.color = selectedTags.length ? 'var(--bamboo)' : '';
      });
      tagSelect.appendChild(el);
    });
    tagHint.textContent = '请至少选择一个标签，方便日后分类与统计';
    tagHint.style.color = '';
  }
  courseSelect.addEventListener('change', renderTags);
  renderTags();

  if (submit) submit.addEventListener('click', function (e) {
    e.preventDefault();
    if (selectedTags.length === 0) { showToast('请先选择至少一个标签'); return; }
    open();
  });
  if (cancel) cancel.addEventListener('click', close);
  if (mask) mask.addEventListener('click', function (e) {
    if (e.target === mask) close();
  });
  if (mask) mask.querySelectorAll('[data-share]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      close();
      showToast('这一次实践已记录，也分享给了' + btn.getAttribute('data-share') + ' —— 一颗星不耀眼，很多星就是光。');
    });
  });
})();
</script>
</body>
</html>
