<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>若星 · 往期课程</title>
<link rel="stylesheet" href="assets/ruoxing.css">
<style>
  .notice-rows { display: flex; flex-direction: column; }
  .notice-rows .row { display: flex; padding: 10px 0; font-size: 14px; line-height: 1.6; }
  .notice-rows .row + .row { border-top: 1px solid var(--rice); }
  .notice-rows .k { flex-shrink: 0; width: 76px; color: var(--ash); font-size: 13px; padding-top: 1px; }
  .notice-rows .v { color: var(--ink); }
</style>
</head>
<body>
<div class="screen">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor" stroke="none"/><path d="M23.5 3.5v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <div class="navbar">
    <a class="back" aria-label="返回" href="courses.html"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 36L19 24L31 12"/></svg></a>
    <span class="nav-title">往期回顾</span>
    <div class="capsule" aria-hidden="true"><span class="cap-half"><span class="cap-dots"><i></i><i></i><i></i></span></span><span class="cap-divider"></span><span class="cap-half"><span class="cap-target"></span></span></div>
  </div>

  <!-- 头图 -->
  <div class="section" style="margin-bottom: 26px;">
    <div class="photo photo-read" style="aspect-ratio: 4/3; border-radius: 12px;"><span class="photo-label">课程实景</span></div>
  </div>

  <!-- 眉题 + 主题句 -->
  <div class="section" style="margin-bottom: 30px;">
    <div class="eyebrow" style="margin-bottom: 10px;">拾光读书 · 第 2 期</div>
    <h1 class="page-title" style="margin-bottom: 18px;">《活着》· 在文字里照见自己</h1>
    <p class="body-text" style="color: var(--ash);">
      这一期我们一起读完了《活着》。八周的相伴已经结束，感谢每一位同行的书友。新一期的共读正在路上，期待与你再见。
    </p>
  </div>

  <!-- 课程回顾 -->
  <div class="section" style="margin-bottom: 140px;">
    <div class="section-head"><span class="section-title bilingual">课程回顾</span></div>
    <div class="notice-rows">
      <div class="row"><span class="k">开课时间</span><span class="v">6 月 7 日起 · 每周六晚 20:00</span></div>
      <div class="row"><span class="k">课程形式</span><span class="v">线上 · 腾讯会议直播</span></div>
      <div class="row"><span class="k">参与书友</span><span class="v">24 位</span></div>
      <div class="row"><span class="k">课程状态</span><span class="v">已结课</span></div>
    </div>
  </div>

  <!-- 底部行动条 -->
  <div class="action-bar">
    <div class="btn-disabled">已结束</div>
  </div>

</div>
</body>
</html>
