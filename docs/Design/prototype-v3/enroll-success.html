<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>若星 · 报名成功</title>
<link rel="stylesheet" href="assets/ruoxing.css">
<style>
  .hero {
    position: relative; text-align: center;
    padding: 72px 32px 44px;
  }
  .hero .big-star {
    font-size: 36px; color: var(--starlight); line-height: 1.4;
    animation: starOn .8s ease-out both;
  }
  .hero .hero-line {
    font-family: var(--serif); font-size: 22px; font-weight: 500;
    color: #F2EEE2; margin-top: 20px; line-height: 1.6;
    animation: fadeUp .5s ease-out .3s both;
  }
  .hero .hero-meta {
    margin-top: 14px; font-size: 13px; color: rgba(233,228,216,.6);
    line-height: 1.8;
    animation: fadeUp .5s ease-out .5s both;
  }
  .panel-wrap { padding: 0 20px; animation: fadeUp .5s ease-out .7s both; }
  .night-panel { padding: 20px; }
  .panel-title {
    font-family: var(--serif); font-size: 15px; font-weight: 500;
    color: var(--starlight); margin-bottom: 16px;
  }
  .guide-body { display: flex; gap: 16px; align-items: flex-start; }
  .guide-steps { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .guide-steps .step { display: flex; gap: 10px; font-size: 13px; line-height: 1.7; color: rgba(233,228,216,.85); }
  .guide-steps .num {
    flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid rgba(240,217,168,.5); color: var(--starlight);
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    margin-top: 3px;
  }
  .qr {
    flex-shrink: 0; width: 72px; height: 72px; border-radius: 8px;
    background: #FDF8EE; display: flex; align-items: center; justify-content: center;
    color: var(--night-mist); font-size: 16px;
  }
  .night-actions { padding: 40px 20px 0; text-align: center; animation: fadeUp .5s ease-out .9s both; }
  .night-actions .btn-text { display: inline-block; margin-top: 22px; color: var(--starlight); }
</style>
</head>
<body>
<div class="screen night no-tabbar">

  <!-- 微光星点背景 -->
  <div class="stars-bg">
    <i style="top:12%; left:18%; width:3px; height:3px; opacity:.6;"></i>
    <i style="top:9%; left:74%; width:2px; height:2px; opacity:.45;"></i>
    <i style="top:22%; left:88%; width:3px; height:3px; opacity:.5;" class="breathing"></i>
    <i style="top:30%; left:8%; width:2px; height:2px; opacity:.4;"></i>
    <i style="top:6%; left:45%; width:4px; height:4px; opacity:.35;"></i>
    <i style="top:38%; left:80%; width:2px; height:2px; opacity:.5;" class="breathing"></i>
    <i style="top:26%; left:55%; width:2px; height:2px; opacity:.3;"></i>
    <i style="top:16%; left:32%; width:3px; height:3px; opacity:.4;"></i>
  </div>

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5"/><rect x="2.5" y="2.5" width="15" height="6" rx="1" fill="currentColor" stroke="none"/><path d="M23.5 3.5v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <!-- 小程序导航栏 -->
  <div class="navbar">
    <span class="nav-spacer"></span>
    <span class="nav-title">报名成功</span>
    <div class="capsule" aria-hidden="true"><span class="cap-half"><span class="cap-dots"><i></i><i></i><i></i></span></span><span class="cap-divider"></span><span class="cap-half"><span class="cap-target"></span></span></div>
  </div>

  <!-- 仪式时刻 -->
  <div class="hero" style="padding-top: 40px;">
    <div class="big-star">✦</div>
    <div class="hero-line">已为你留好位置。</div>
    <div class="hero-meta">
      生活料理 · 第 12 期<br>
      9 月 3 日开课
    </div>
  </div>

  <!-- 入群指引 -->
  <div class="panel-wrap">
    <div class="night-panel">
      <div class="panel-title">入群指引</div>
      <div class="guide-body">
        <div class="guide-steps">
          <div class="step"><span class="num">1</span><span>长按识别右侧二维码，添加课程助手</span></div>
          <div class="step"><span class="num">2</span><span>发送你的报名手机号</span></div>
          <div class="step"><span class="num">3</span><span>课程助手会邀请你进入班级群</span></div>
        </div>
        <div class="qr">✦</div>
      </div>
    </div>
  </div>

  <!-- 底部行动 -->
  <div class="night-actions">
    <a class="btn-primary" href="learn.html">查看我的课程</a>
    <a class="btn-text" href="home.html">回到首页</a>
  </div>

</div>
</body>
</html>
