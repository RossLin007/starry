<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>若星 · 我的订单</title>
<link rel="stylesheet" href="assets/ruoxing.css">
<style>
  .order-card { padding: 18px; }
  .order-head { display: flex; justify-content: space-between; align-items: baseline; }
  .order-status { font-size: 13px; color: var(--bamboo); }
  .order-status.done { color: var(--ash); }
  .order-name { font-family: var(--serif); font-size: 16px; font-weight: 500; margin: 10px 0 6px; }
  .order-price { text-align: right; font-size: 15px; color: var(--ink); margin-top: 14px; }
  .order-gap { height: 16px; }
</style>
</head>
<body>
<div class="screen no-tabbar">

  <div class="section fade-up" style="margin-top: 8px;">
    <div class="card order-card">
      <div class="order-head">
        <span class="micro">2026 年 7 月 20 日</span>

    <div class="card order-card">
      <div class="order-head">

    <div class="order-gap"></div>

      <div class="order-head">
        <span class="micro">2026 年 5 月 9 日</span>

</div>
